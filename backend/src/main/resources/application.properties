spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shorturl}
spring.datasource.username=${DB_USERNAME:shorturl}
spring.datasource.password=${DB_PASSWORD:shorturl}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
# Runs behind Caddy, which sets X-Forwarded-For; the rate limit keys on the resulting client IP.
server.forward-headers-strategy=framework

app.rate-limit.creations-per-minute=10

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}
