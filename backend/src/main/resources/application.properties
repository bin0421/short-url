spring.application.name=backend
# Hosting platforms such as Render assign the port through PORT.
server.port=${PORT:8080}

# Either a full JDBC URL (DB_URL) or its parts (Render's Blueprint can only pass host, port and name separately).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shorturl}}
spring.datasource.username=${DB_USERNAME:shorturl}
spring.datasource.password=${DB_PASSWORD:shorturl}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
# Runs behind a proxy (Caddy, or Render's edge) that sets X-Forwarded-For; the rate limit keys on the resulting client IP.
server.forward-headers-strategy=framework

app.rate-limit.creations-per-minute=10

# Render sets RENDER_EXTERNAL_URL (e.g. https://short-url.onrender.com) automatically.
app.public-base-url=${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:5173}}
